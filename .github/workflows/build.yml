name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────
  # META : extrait APP_VERSION du .py (seule source de vérité)
  # ─────────────────────────────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: extract
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' traitement_facture.py)
          if [ -z "$VERSION" ]; then
            echo "::error::Impossible d'extraire APP_VERSION du traitement_facture.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version détectée : $VERSION"

  # ─────────────────────────────────────────
  # BUILD WINDOWS
  # ─────────────────────────────────────────
  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller customtkinter anthropic pypdf pdf2image pillow keyring httpx

      - name: Download Poppler for Windows
        run: |
          curl -L -o poppler.zip "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Expand-Archive -Path poppler.zip -DestinationPath poppler_extract
          Move-Item poppler_extract\poppler-24.08.0 poppler
          Remove-Item poppler.zip
          Remove-Item -Recurse poppler_extract

      - name: Generate app_icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('logo_titlebar.png'); img.save('app_icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Build with PyInstaller
        run: |
          pyinstaller traitement_facture.spec --clean

      - name: Install Inno Setup via Chocolatey
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.meta.outputs.version }}" traitement_facture_setup.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: output\TraitementFactures_Setup_v${{ needs.meta.outputs.version }}.exe

  # ─────────────────────────────────────────
  # BUILD MAC
  # ─────────────────────────────────────────
  build-mac:
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip3 install pyinstaller customtkinter anthropic pypdf pdf2image pillow keyring httpx

      - name: Install Poppler via Homebrew
        run: |
          brew install poppler

      - name: Generate app_icon.icns
        run: |
          mkdir -p app_icon.iconset
          sips -z 16 16     logo_titlebar.png --out app_icon.iconset/icon_16x16.png
          sips -z 32 32     logo_titlebar.png --out app_icon.iconset/icon_16x16@2x.png
          sips -z 32 32     logo_titlebar.png --out app_icon.iconset/icon_32x32.png
          sips -z 64 64     logo_titlebar.png --out app_icon.iconset/icon_32x32@2x.png
          sips -z 128 128   logo_titlebar.png --out app_icon.iconset/icon_128x128.png
          sips -z 256 256   logo_titlebar.png --out app_icon.iconset/icon_128x128@2x.png
          sips -z 256 256   logo_titlebar.png --out app_icon.iconset/icon_256x256.png
          sips -z 512 512   logo_titlebar.png --out app_icon.iconset/icon_256x256@2x.png
          sips -z 512 512   logo_titlebar.png --out app_icon.iconset/icon_512x512.png
          sips -z 1024 1024 logo_titlebar.png --out app_icon.iconset/icon_512x512@2x.png
          iconutil -c icns app_icon.iconset

      - name: Build with PyInstaller
        run: |
          pyinstaller traitement_facture_mac.spec --clean

      # ── TESTS DU BUNDLE ──────────────────────
      - name: "Test 1: Bundle structure exists"
        run: |
          echo "=== Checking .app structure ==="
          APP="dist/Traitement de factures.app"
          test -d "$APP" && echo "OK .app exists" || (echo "FAIL .app missing" && exit 1)
          test -f "$APP/Contents/MacOS/TraitementFactures" && echo "OK executable exists" || (echo "FAIL executable missing" && exit 1)
          echo "=== Contents/MacOS ==="
          ls "$APP/Contents/MacOS/" | head -20
          echo "=== Contents/Resources ==="
          ls "$APP/Contents/Resources/" 2>/dev/null | head -10 || echo "(no Resources)"

      - name: "Test 2: Poppler binaries in bundle"
        run: |
          echo "=== Full dist structure (poppler + pdftoppm) ==="
          find dist/ -name "pdftoppm" -o -name "pdfinfo" -o -name "poppler" -type d 2>/dev/null
          echo ""
          echo "=== Contents/MacOS top-level ==="
          ls "dist/Traitement de factures.app/Contents/MacOS/" | head -30
          echo ""
          # Find the actual location of pdftoppm
          PDFTOPPM=$(find dist/ -name "pdftoppm" -type f | head -1)
          if [ -n "$PDFTOPPM" ]; then
            echo "OK pdftoppm found at: $PDFTOPPM"
            POPPLER_DIR=$(dirname "$PDFTOPPM")
            echo "OK pdfinfo at: $(find dist/ -name pdfinfo -type f | head -1)"
          else
            echo "FAIL pdftoppm not found anywhere in dist/"
            echo "=== Full dist tree ==="
            find dist/ -type f | grep -v ".pyc\|__pycache__" | head -50
            exit 1
          fi

      - name: "Test 3: Poppler dylib dependencies resolved"
        run: |
          PDFTOPPM=$(find dist/ -name "pdftoppm" -type f | head -1)
          echo "=== pdftoppm dependencies ==="
          otool -L "$PDFTOPPM"
          echo ""
          echo "=== Checking for broken Homebrew references ==="
          BROKEN=$(otool -L "$PDFTOPPM" | grep -c "/opt/homebrew\|/usr/local/Cellar" || true)
          if [ "$BROKEN" -gt 0 ]; then
            echo "FAIL: $BROKEN unresolved Homebrew references"
            otool -L "$PDFTOPPM" | grep "/opt/homebrew\|/usr/local/Cellar"
            exit 1
          fi
          echo "OK pdftoppm — no broken references"

      - name: "Test 4: Poppler runs a real PDF conversion"
        run: |
          PDFTOPPM=$(find dist/ -name "pdftoppm" -type f | head -1)
          PDFINFO=$(find dist/ -name "pdfinfo" -type f | head -1)
          POPPLER_BIN=$(dirname "$PDFTOPPM")
          # Set library path to same directory as binaries (PyInstaller puts dylibs there)
          export DYLD_LIBRARY_PATH="$POPPLER_BIN:$(dirname "$POPPLER_BIN")"
          # Create a minimal test PDF
          python3 -c "
          from pypdf import PdfWriter
          w = PdfWriter()
          w.add_blank_page(width=612, height=792)
          with open('/tmp/test.pdf', 'wb') as f:
              w.write(f)
          print('OK test PDF created')
          "
          echo "=== Running pdftoppm ==="
          "$PDFTOPPM" -jpeg -r 72 /tmp/test.pdf /tmp/test_out
          test -f /tmp/test_out-1.jpg && echo "OK pdftoppm produced JPEG output" || (echo "FAIL pdftoppm produced no output" && exit 1)
          ls -la /tmp/test_out*
          echo "=== Running pdfinfo ==="
          "$PDFINFO" /tmp/test.pdf && echo "OK pdfinfo works" || (echo "FAIL pdfinfo crashed" && exit 1)

      - name: "Test 5: Bundle executable runs (smoke test)"
        run: |
          APP="dist/Traitement de factures.app/Contents/MacOS/TraitementFactures"
          echo "=== Smoke test: launch and quit after 3s ==="
          # Launch the app in background, wait 3s, check it didn't crash immediately
          "$APP" &
          APP_PID=$!
          sleep 3
          if kill -0 $APP_PID 2>/dev/null; then
            echo "OK app is still running after 3s (no immediate crash)"
            kill $APP_PID 2>/dev/null || true
          else
            wait $APP_PID 2>/dev/null
            EXIT_CODE=$?
            echo "FAIL app exited with code $EXIT_CODE within 3s"
            exit 1
          fi

      - name: "Test 6: Fonts bundled"
        run: |
          MEIPASS="dist/Traitement de factures.app/Contents/MacOS"
          echo "=== Checking fonts ==="
          for font in "Coolvetica Rg.otf" "Coolvetica Rg It.otf" "Coolvetica Rg Cond.otf" "Coolvetica Rg Cram.otf" "Coolvetica Hv Comp.otf"; do
            test -f "$MEIPASS/$font" && echo "OK $font" || echo "WARN $font missing (non-critical)"
          done
          test -f "$MEIPASS/logo_titlebar.png" && echo "OK logo_titlebar.png" || echo "WARN logo missing"

      - name: "Test 7: pdf2image with bundled poppler"
        run: |
          PDFTOPPM=$(find dist/ -name "pdftoppm" -type f | head -1)
          POPPLER_BIN=$(dirname "$PDFTOPPM")
          export DYLD_LIBRARY_PATH="$POPPLER_BIN:$(dirname "$POPPLER_BIN")"
          python3 -c "
          from pdf2image import convert_from_path
          images = convert_from_path('/tmp/test.pdf', dpi=72, poppler_path='$POPPLER_BIN')
          assert len(images) == 1, f'Expected 1 page, got {len(images)}'
          print(f'OK pdf2image converted 1 page, size={images[0].size}')
          "
      # ── FIN TESTS ────────────────────────────

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Create DMG
        run: |
          mkdir -p output
          create-dmg \
            --volname "Traitement de factures" \
            --volicon "app_icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Traitement de factures.app" 175 190 \
            --hide-extension "Traitement de factures.app" \
            --app-drop-link 425 190 \
            "output/TraitementFactures_v${{ needs.meta.outputs.version }}.dmg" \
            "dist/" || true

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v5
        with:
          name: mac-dmg
          path: output/TraitementFactures_v${{ needs.meta.outputs.version }}.dmg

  # ─────────────────────────────────────────
  # CREATE GITHUB RELEASE (+ version.json pour auto-update)
  # ─────────────────────────────────────────
  release:
    needs: [meta, build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (pour CHANGELOG.md)
        uses: actions/checkout@v5

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: windows-installer
          path: release/

      - name: Download Mac DMG
        uses: actions/download-artifact@v5
        with:
          name: mac-dmg
          path: release/

      - name: Generate version.json (pour la bannière auto-update)
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 <<'PY'
          import json, os, re
          version = os.environ['APP_VERSION']
          try:
              changelog_md = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              changelog_md = ''
          # Extrait les bullets de la section "## vX.Y" du CHANGELOG
          m = re.search(r'## v' + re.escape(version) + r'[^\n]*\n(.*?)(?=\n## |\Z)', changelog_md, re.S)
          bullets = []
          if m:
              for line in m.group(1).strip().split('\n'):
                  line = line.strip()
                  if line.startswith('- '):
                      bullets.append(line[2:].strip())
          data = {
              'version': version,
              'changelog': bullets,
              'download_url': 'https://github.com/sebjacques20/Traitement-factures/releases/latest',
          }
          os.makedirs('release', exist_ok=True)
          with open('release/version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('=== version.json généré ===')
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: "Traitement de factures v${{ needs.meta.outputs.version }}"
          body: |
            ## Traitement de factures v${{ needs.meta.outputs.version }}

            Application de traitement automatique de factures PDF par intelligence artificielle.

            ### Téléchargement

            | Plateforme | Fichier |
            |------------|---------|
            | **Windows** | `TraitementFactures_Setup_v${{ needs.meta.outputs.version }}.exe` — Installateur classique |
            | **Mac** | `TraitementFactures_v${{ needs.meta.outputs.version }}.dmg` — Glisser dans Applications |

            Notes de release détaillées : voir [CHANGELOG.md](https://github.com/sebjacques20/Traitement-factures/blob/main/CHANGELOG.md).

            ### Installation

            **Windows :**
            1. Téléchargez le `.exe`
            2. Lancez l'installateur
            3. Suivez les étapes

            **Mac :**
            1. Téléchargez le `.dmg`
            2. Ouvrez-le et glissez l'app dans Applications
            3. Au premier lancement : clic droit → Ouvrir (Gatekeeper)

            ---
            *Développé par Sédentaire.co*
          files: |
            release/TraitementFactures_Setup_v${{ needs.meta.outputs.version }}.exe
            release/TraitementFactures_v${{ needs.meta.outputs.version }}.dmg
            release/version.json
          make_latest: true
