name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────
  # BUILD WINDOWS
  # ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller customtkinter anthropic pypdf pdf2image pillow keyring httpx

      - name: Download Poppler for Windows
        run: |
          curl -L -o poppler.zip "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Expand-Archive -Path poppler.zip -DestinationPath poppler_extract
          Move-Item poppler_extract\poppler-24.08.0 poppler
          Remove-Item poppler.zip
          Remove-Item -Recurse poppler_extract

      - name: Generate app_icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('logo_titlebar.png'); img.save('app_icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Build with PyInstaller
        run: |
          pyinstaller traitement_facture.spec --clean

      - name: Install Inno Setup via Chocolatey
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" traitement_facture_setup.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output\TraitementFactures_Setup_v2.0.exe

  # ─────────────────────────────────────────
  # BUILD MAC
  # ─────────────────────────────────────────
  build-mac:
    runs-on: macos-13   # Intel x86_64 — compatible Apple Silicon via Rosetta 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip3 install pyinstaller customtkinter anthropic pypdf pdf2image pillow keyring httpx

      - name: Install Poppler via Homebrew
        run: |
          brew install poppler

      - name: Copy Poppler binaries and fix dylibs for bundling
        run: |
          mkdir -p poppler/bin poppler/lib
          BREW_PREFIX=$(brew --prefix)

          # Copy binaries
          cp "$BREW_PREFIX/bin/pdftoppm" poppler/bin/
          cp "$BREW_PREFIX/bin/pdfinfo" poppler/bin/

          # Recursively copy all required dylibs
          copy_deps() {
            local binary="$1"
            for lib in $(otool -L "$binary" | grep "$BREW_PREFIX" | awk '{print $1}'); do
              local libname=$(basename "$lib")
              if [ ! -f "poppler/lib/$libname" ]; then
                cp "$lib" "poppler/lib/$libname"
                # Recurse into this lib's dependencies
                copy_deps "poppler/lib/$libname"
              fi
            done
          }

          for bin in poppler/bin/*; do
            copy_deps "$bin"
          done

          # Fix dylib paths using install_name_tool
          for bin in poppler/bin/*; do
            for lib in $(otool -L "$bin" | grep "$BREW_PREFIX" | awk '{print $1}'); do
              libname=$(basename "$lib")
              install_name_tool -change "$lib" "@executable_path/../lib/$libname" "$bin" 2>/dev/null || true
            done
          done

          for dylib in poppler/lib/*.dylib; do
            # Fix the dylib's own ID
            libname=$(basename "$dylib")
            install_name_tool -id "@loader_path/$libname" "$dylib" 2>/dev/null || true
            # Fix references to other dylibs
            for lib in $(otool -L "$dylib" | grep "$BREW_PREFIX" | awk '{print $1}'); do
              dep_name=$(basename "$lib")
              install_name_tool -change "$lib" "@loader_path/$dep_name" "$dylib" 2>/dev/null || true
            done
          done

          echo "=== Poppler binaries ==="
          ls -la poppler/bin/ poppler/lib/
          echo "=== pdftoppm deps ==="
          otool -L poppler/bin/pdftoppm

      - name: Generate app_icon.icns
        run: |
          mkdir -p app_icon.iconset
          sips -z 16 16     logo_titlebar.png --out app_icon.iconset/icon_16x16.png
          sips -z 32 32     logo_titlebar.png --out app_icon.iconset/icon_16x16@2x.png
          sips -z 32 32     logo_titlebar.png --out app_icon.iconset/icon_32x32.png
          sips -z 64 64     logo_titlebar.png --out app_icon.iconset/icon_32x32@2x.png
          sips -z 128 128   logo_titlebar.png --out app_icon.iconset/icon_128x128.png
          sips -z 256 256   logo_titlebar.png --out app_icon.iconset/icon_128x128@2x.png
          sips -z 256 256   logo_titlebar.png --out app_icon.iconset/icon_256x256.png
          sips -z 512 512   logo_titlebar.png --out app_icon.iconset/icon_256x256@2x.png
          sips -z 512 512   logo_titlebar.png --out app_icon.iconset/icon_512x512.png
          sips -z 1024 1024 logo_titlebar.png --out app_icon.iconset/icon_512x512@2x.png
          iconutil -c icns app_icon.iconset

      - name: Build with PyInstaller
        run: |
          pyinstaller traitement_facture_mac.spec --clean

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Create DMG
        run: |
          mkdir -p output
          create-dmg \
            --volname "Traitement de factures" \
            --volicon "app_icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Traitement de factures.app" 175 190 \
            --hide-extension "Traitement de factures.app" \
            --app-drop-link 425 190 \
            "output/TraitementFactures_v2.0.dmg" \
            "dist/" || true

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: output/TraitementFactures_v2.0.dmg

  # ─────────────────────────────────────────
  # CREATE GITHUB RELEASE
  # ─────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/

      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release/

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "Traitement de factures v2.0"
          body: |
            ## Traitement de factures v2.0

            Application de traitement automatique de factures PDF par intelligence artificielle.

            ### Téléchargement

            | Plateforme | Fichier |
            |------------|---------|
            | **Windows** | `TraitementFactures_Setup_v2.0.exe` — Installateur classique |
            | **Mac** | `TraitementFactures_v2.0.dmg` — Glisser dans Applications |

            ### Installation

            **Windows :**
            1. Téléchargez le `.exe`
            2. Lancez l'installateur
            3. Suivez les étapes

            **Mac :**
            1. Téléchargez le `.dmg`
            2. Ouvrez-le et glissez l'app dans Applications
            3. Au premier lancement : clic droit → Ouvrir (Gatekeeper)

            ---
            *Développé par Sédentaire.co*
          files: |
            release/TraitementFactures_Setup_v2.0.exe
            release/TraitementFactures_v2.0.dmg
          make_latest: true
